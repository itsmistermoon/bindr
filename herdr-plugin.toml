id = "itsmistermoon.bindr"
name = "bindr"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Switch between named keybinding profiles (Zellij-style presets) by swapping the global [keys] table in config.toml."
platforms = ["macos", "linux"]

# Requires `cargo` on the installing machine. Runs once during
# `herdr plugin install`, before Herdr registers the plugin (not on
# `herdr plugin link`, used for local dev -- run `cargo build --release`
# by hand there instead, see README).
[[build]]
command = ["cargo", "build", "--release"]

# Profiles live under HERDR_PLUGIN_CONFIG_DIR/profiles/<name>.toml, each holding
# only the [keys] table (and any [keys.*] dotted subtables). Other plugins'
# [[keys.command]] blocks are never touched.
[[actions]]
id = "switch-profile"
title = "bindr: switch profile"
contexts = ["workspace"]
command = ["./target/release/bindr", "switch"]

# Write the target profile name to HERDR_PLUGIN_CONFIG_DIR/pending-name
# before invoking this action to pick a profile explicitly instead of
# cycling (see save-as.sh).
[[actions]]
id = "save-profile"
title = "bindr: save current keybindings as a new profile"
contexts = ["workspace"]
command = ["./target/release/bindr", "save"]

# Self-closing popup used to simulate a toast: lists every profile, marking
# the active one, and exits after a short delay, which closes the pane.
[[panes]]
id = "toast"
title = "keybind profile"
placement = "popup"
command = ["./target/release/bindr", "toast"]

[[actions]]
id = "show-keybinds"
title = "bindr: view keybinds"
contexts = ["workspace"]
command = ["./target/release/bindr", "show-keybinds"]

# Read-only replica of the built-in prefix+? panel, plus shift+K to switch
# profiles in place. Unlike "toast" this one keeps focus -- the user
# scrolls and closes it interactively. Sized to match the built-in panel's
# fixed 76x22 modal (see keybind_help.rs's render_modal_shell call).
[[panes]]
id = "keybinds"
title = "bindr"
placement = "popup"
width = 76
height = 22
command = ["./target/release/bindr", "keybinds-view"]
